name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch: {}

jobs:
  lint:
    name: Run ansible-lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install tools via mise
        uses: jdx/mise-action@v4

      - name: Install project dependencies
        run: uv sync --locked

      - name: Install Ansible Galaxy roles
        working-directory: ansible
        run: uv run ansible-galaxy install -r requirements.yaml

      - name: Run ansible-lint
        working-directory: ansible
        run: uv run ansible-lint .

      - name: Terraform
        working-directory: terraform
        run: |
          terraform -chdir=talos init -backend=false
          terraform -chdir=talos validate
          terraform -chdir=hetzner init -backend=false
          terraform -chdir=hetzner validate
