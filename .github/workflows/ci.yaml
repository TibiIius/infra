name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch: {}

env:
  TALOS_VERSION: v1.13.8

jobs:
  molecule-test:
    name: Run molecule tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install system deps (QEMU, 7zip, python3, curl)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 qemu-utils p7zip-full curl python3

      - name: Install tools via mise
        uses: jdx/mise-action@v4

      - name: Cache Talos ISO
        uses: actions/cache@v6
        with:
          path: /home/runner/talos-iso-cache
          key: talos-${{ env.TALOS_VERSION }}-metal-amd64
          restore-keys: |
            talos-${{ env.TALOS_VERSION }}-

      - name: Download Talos ISO (if not cached)
        run: |
          mkdir -p /home/runner/talos-iso-cache
          if [[ ! -f /home/runner/talos-iso-cache/metal-amd64.iso ]]; then
            curl -fsSL -o /home/runner/talos-iso-cache/metal-amd64.iso \
              "https://github.com/siderolabs/talos/releases/download/v${{ env.TALOS_VERSION }}/metal-amd64.iso"
          fi

      - name: Install project dependencies (including molecule)
        run: uv sync --locked

      - name: Install Ansible Galaxy roles
        working-directory: ansible
        run: uv run ansible-galaxy install -r requirements.yaml

      - name: Initialize terraform
        working-directory: terraform/talos
        run: |
          terraform init

      - name: Run molecule tests
        working-directory: ansible/roles/talos
        run: |
          export ANSIBLE_ROLES_PATH="$PWD/../..:$PWD/../../.."
          uv run molecule test

      - name: Upload test artifacts (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: talos-molecule-artifacts
          path: |
            ansible/roles/talos/.molecule-work/
          if-no-files-found: ignore
