---
- name: Bootstrap CoreOS VM - Generate ISOs
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    tf_dir: ../terraform/coreos-vm
    vm_count: 1
    vm_ips:
      - "192.168.178.192"
    base_hostname: "coreos-vm"
    coreos_iso: "/var/cache/coreos/fedora-coreos.iso"
    iso_output_dir: "/tmp/coreos-ignition-isos"
  tasks:
    - name: Provision CoreOS VM ignition configs
      community.general.terraform:
        project_path: "{{ tf_dir }}"
        state: present
        variables:
          vm_count: "{{ vm_count }}"
          vm_ips: "{{ vm_ips }}"
          base_hostname: "{{ base_hostname }}"
      register: tf_output

    - name: Display provisioned VMs
      ansible.builtin.debug:
        msg: "Provisioned {{ vm_count }} VM(s): {{ tf_output.outputs.vm_names.value }} with IPs {{ tf_output.outputs.vm_ips.value }}"

    - name: Create ISO output directory
      ansible.builtin.file:
        path: "{{ iso_output_dir }}"
        state: directory
        mode: "0755"

    - name: Write ignition JSON files
      ansible.builtin.copy:
        content: "{{ tf_output.outputs.ignition_configs.value[item] }}"
        dest: "{{ iso_output_dir }}/{{ item }}.ignition.json"
      loop: "{{ tf_output.outputs.vm_names.value }}"

    - name: Create ISOs with ignition baked in
      ansible.builtin.command:
        cmd: >
          bash {{ tf_dir }}/create_iso.sh
          {{ coreos_iso }}
          {{ iso_output_dir }}/{{ item }}.ignition.json
          {{ iso_output_dir }}/{{ item }}-ignition.iso
      loop: "{{ tf_output.outputs.vm_names.value }}"
      register: iso_creation
      changed_when: true

    - name: Display ISO locations
      ansible.builtin.debug:
        msg: "ISOs ready at {{ iso_output_dir }}:"

    - name: List created ISOs
      ansible.builtin.command:
        cmd: ls -lh {{ iso_output_dir }}/*.iso
      changed_when: false

    - name: Wait for VMs to be created
      ansible.builtin.pause:
        prompt: "Upload ISOs to TrueNAS and create VMs. Press Enter when done..."

    - name: Add VMs to dynamic inventory
      ansible.builtin.add_host:
        name: "{{ item }}"
        ansible_connection: ssh
        ansible_user: ansible
        groups: coreos_vms
      loop: "{{ vm_ips }}"

- name: Bootstrap CoreOS VM - Setup and Tune
  hosts: coreos_vms
  gather_facts: false
  tasks:
    - name: Wait for SSH
      ansible.builtin.wait_for_connection:
        delay: 5
        timeout: 600

    - name: Setup user
      ansible.builtin.include_role:
        name: setup_user

    - name: Apply CoreOS tuning
      ansible.builtin.include_role:
        name: coreos_tuning
