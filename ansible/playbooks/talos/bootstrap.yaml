---
- name: Bootstrap Talos VPS
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    tf_dir: ../terraform/hetzner
    hcloud_token: "{{ lookup('env', 'HCLOUD_TOKEN') }}"
    control_plane_count: 1
    worker_count: 0
  tasks:
    - name: Provision Hetzner infrastructure
      community.general.terraform:
        project_path: "{{ tf_dir }}"
        state: present
        variables:
          hcloud_token: "{{ hcloud_token }}"
          control_plane_count: "{{ control_plane_count }}"
          worker_count: "{{ worker_count }}"
      register: tf_output

    - name: Wait for Talos API to be ready
      ansible.builtin.command:
        cmd: "talosctl --nodes {{ tf_output.outputs.talos_endpoint.value }} health"
      register: talos_health
      until: talos_health.rc == 0
      retries: 30
      delay: 10
      changed_when: false
      failed_when: false

    - name: Apply Talos control plane configuration
      ansible.builtin.command:
        cmd: "talosctl --nodes {{ tf_output.outputs.talos_endpoint.value }} apply-config --file /etc/talos/machine-config.yaml"
      changed_when: true
      failed_when: false

    - name: Wait for Kubernetes API to be ready
      ansible.builtin.command:
        cmd: "kubectl --kubeconfig /etc/talos/kubeconfig get nodes"
      register: k8s_ready
      until: k8s_ready.rc == 0
      retries: 60
      delay: 10
      changed_when: false
      failed_when: false

    - name: Display cluster status
      ansible.builtin.debug:
        msg: "Talos cluster is ready at {{ tf_output.outputs.talos_endpoint.value }}"
