---
- name: Bootstrap Talos - Hetzner VPS
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    tf_dir: ../terraform/hetzner
    hcloud_token: "{{ lookup('env', 'HCLOUD_TOKEN') }}"
    node_count: 1
  tasks:
    - name: Provision Hetzner infrastructure
      community.general.terraform:
        project_path: "{{ tf_dir }}"
        state: present
        variables:
          hcloud_token: "{{ hcloud_token }}"
          node_count: "{{ node_count }}"
      register: tf_output

    - name: Wait for Talos API to be ready
      ansible.builtin.command:
        cmd: "talosctl --nodes {{ tf_output.outputs.talos_endpoint.value }} health"
      register: talos_health
      until: talos_health.rc == 0
      retries: 30
      delay: 10
      changed_when: false
      failed_when: false

    - name: Wait for Kubernetes API to be ready
      ansible.builtin.command:
        cmd: "kubectl --kubeconfig /etc/talos/kubeconfig get nodes"
      register: k8s_ready
      until: k8s_ready.rc == 0
      retries: 60
      delay: 10
      changed_when: false
      failed_when: false

    - name: Display cluster status
      ansible.builtin.debug:
        msg: "Talos VPS cluster is ready at {{ tf_output.outputs.talos_endpoint.value }}"

- name: Bootstrap Talos - TrueNAS VMs
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    talos_version: "1.7.0"
    talos_cluster_name: "talos-home"
    talos_endpoint: "https://192.168.178.192:6443"
    talos_nodes:
      - "192.168.178.192"
  tasks:
    - name: Generate Talos machine config
      ansible.builtin.command:
        cmd: "talosctl gen config {{ talos_cluster_name }} {{ talos_endpoint }} /tmp/talos-{{ talos_cluster_name }}"
      args:
        creates: "/tmp/talos-{{ talos_cluster_name }}/machine-config.yaml"
      changed_when: false

    - name: Pause for VM creation
      ansible.builtin.pause:
        prompt: >
          Boot Talos VMs on TrueNAS with the Talos installer ISO.
          Once VMs are running and reachable, press Enter to continue...

    - name: Apply Talos config to nodes
      ansible.builtin.command:
        cmd: "talosctl --nodes {{ item }} apply-config --file /tmp/talos-{{ talos_cluster_name }}/machine-config.yaml"
      loop: "{{ talos_nodes }}"
      changed_when: true
      failed_when: false

    - name: Wait for Talos API to be ready
      ansible.builtin.command:
        cmd: "talosctl --nodes {{ talos_endpoint }} health"
      register: talos_health
      until: talos_health.rc == 0
      retries: 30
      delay: 10
      changed_when: false
      failed_when: false

    - name: Wait for Kubernetes API to be ready
      ansible.builtin.command:
        cmd: "kubectl --kubeconfig /tmp/talos-{{ talos_cluster_name }}/kubernetes.yaml get nodes"
      register: k8s_ready
      until: k8s_ready.rc == 0
      retries: 60
      delay: 10
      changed_when: false
      failed_when: false

    - name: Display cluster status
      ansible.builtin.debug:
        msg: "Talos home cluster is ready at {{ talos_endpoint }}"
