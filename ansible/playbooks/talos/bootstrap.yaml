---
- name: Bootstrap Talos - Hetzner VPS
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    tf_dir: ../terraform/hetzner
    hcloud_token: "{{ lookup('env', 'HCLOUD_TOKEN') }}"
    node_count: 1
  tasks:
    - name: Provision Hetzner infrastructure
      community.general.terraform:
        project_path: "{{ tf_dir }}"
        state: present
        variables:
          hcloud_token: "{{ hcloud_token }}"
          node_count: "{{ node_count }}"
      register: tf_output

    - name: Wait for Talos API to be ready
      ansible.builtin.command:
        cmd: "talosctl --nodes {{ tf_output.outputs.talos_endpoint.value }} health"
      register: talos_health
      until: talos_health.rc == 0
      retries: 30
      delay: 10
      changed_when: false
      failed_when: false

    - name: Wait for Kubernetes API to be ready
      ansible.builtin.command:
        cmd: "kubectl --kubeconfig /etc/talos/kubeconfig get nodes"
      register: k8s_ready
      until: k8s_ready.rc == 0
      retries: 60
      delay: 10
      changed_when: false
      failed_when: false

    - name: Display cluster status
      ansible.builtin.debug:
        msg: "Talos VPS cluster is ready at {{ tf_output.outputs.talos_endpoint.value }}"

- name: Bootstrap Talos - TrueNAS VMs
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    tf_dir: ../terraform/talos-home
    control_plane_ips:
      - "192.168.178.192"
    worker_ips: []
  tasks:
    - name: Generate Talos machine configs
      community.general.terraform:
        project_path: "{{ tf_dir }}"
        state: present
        variables:
          control_plane_ips: "{{ control_plane_ips }}"
          worker_ips: "{{ worker_ips }}"
      register: tf_output

    - name: Display generated configs
      ansible.builtin.debug:
        msg: >
          Talos configs generated at {{ tf_output.outputs.config_dir.value }}.
          Cluster endpoint: {{ tf_output.outputs.cluster_endpoint.value }}

    - name: Pause for VM creation
      ansible.builtin.pause:
        prompt: >
          Boot Talos VMs on TrueNAS with the Talos installer ISO.
          Once VMs are running and reachable, press Enter to continue...

    - name: Apply Talos config to control plane nodes
      ansible.builtin.command:
        cmd: >
          talosctl --nodes {{ item }}
          apply-config
          --file {{ tf_output.outputs.config_dir.value }}/cp{{ index control_plane_ips item }}/machine-config.yaml
      loop: "{{ control_plane_ips }}"
      changed_when: true
      failed_when: false

    - name: Apply Talos config to worker nodes
      ansible.builtin.command:
        cmd: >
          talosctl --nodes {{ item }}
          apply-config
          --file {{ tf_output.outputs.config_dir.value }}/wn{{ index worker_ips item }}/machine-config.yaml
      loop: "{{ worker_ips }}"
      when: worker_ips | length > 0
      changed_when: true
      failed_when: false

    - name: Wait for Talos API to be ready
      ansible.builtin.command:
        cmd: "talosctl --nodes {{ tf_output.outputs.cluster_endpoint.value }} health"
      register: talos_health
      until: talos_health.rc == 0
      retries: 30
      delay: 10
      changed_when: false
      failed_when: false

    - name: Wait for Kubernetes API to be ready
      ansible.builtin.command:
        cmd: "kubectl --kubeconfig {{ tf_output.outputs.config_dir.value }}/kubernetes.yaml get nodes"
      register: k8s_ready
      until: k8s_ready.rc == 0
      retries: 60
      delay: 10
      changed_when: false
      failed_when: false

    - name: Display cluster status
      ansible.builtin.debug:
        msg: "Talos home cluster is ready at {{ tf_output.outputs.cluster_endpoint.value }}"
