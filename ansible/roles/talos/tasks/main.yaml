---
- name: Generate Talos machine configs
  community.general.terraform:
    project_path: "{{ talos_tf_dir }}"
    state: present
    variables:
      cluster_name: "{{ talos_cluster_name }}"
      node_ips: "{{ talos_node_ips }}"
  register: talos_tf_output

- name: Display generated configs
  ansible.builtin.debug:
    msg: >
      Talos configs generated at {{ talos_tf_output.outputs.config_dir.value }}.
      Cluster endpoint: {{ talos_tf_output.outputs.cluster_endpoint.value }}

- name: Wait for nodes to be reachable
  ansible.builtin.command:
    cmd: "ping -c 1 -W 2 {{ item }}"
  loop: "{{ talos_node_ips }}"
  register: ping_result
  until: ping_result.rc == 0
  retries: 120
  delay: 10
  changed_when: false

- name: Apply Talos config to nodes
  ansible.builtin.command:
    cmd: >-
      talosctl --nodes {{ item }}
      apply-config
      --file {{ talos_tf_output.outputs.config_dir.value }}/node{{ index talos_node_ips item }}/machine-config.yaml
  loop: "{{ talos_node_ips }}"
  changed_when: true
  failed_when: false

- name: Wait for Talos API to be ready
  ansible.builtin.command:
    cmd: "talosctl --nodes {{ talos_tf_output.outputs.cluster_endpoint.value }} health"
  register: talos_health
  until: talos_health.rc == 0
  retries: 30
  delay: 10
  changed_when: false

- name: Bootstrap the cluster
  ansible.builtin.command:
    cmd: "talosctl --nodes {{ talos_tf_output.outputs.cluster_endpoint.value }} bootstrap"
  changed_when: true
  failed_when: false

- name: Wait for Kubernetes API to be ready
  ansible.builtin.command:
    cmd: "kubectl --kubeconfig {{ talos_tf_output.outputs.config_dir.value }}/kubernetes.yaml get nodes"
  register: k8s_ready
  until: k8s_ready.rc == 0
  retries: 60
  delay: 10
  changed_when: false

- name: Display cluster status
  ansible.builtin.debug:
    msg: "Talos cluster '{{ talos_cluster_name }}' is ready at {{ talos_tf_output.outputs.cluster_endpoint.value }}"
