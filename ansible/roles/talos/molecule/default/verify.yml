---
# Independently verify the cluster the role produced:
#   1. the kubeconfig was written,
#   2. kubectl sees exactly one Ready node.
- name: Verify the Talos cluster is up
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    kubeconfig: "{{ talos_kubeconfig_path }}"
  tasks:
    - name: Confirm the kubeconfig was written
      ansible.builtin.stat:
        path: "{{ kubeconfig }}"
      register: kc

    - name: Fail if the kubeconfig is missing
      ansible.builtin.fail:
        msg: "kubeconfig not found at {{ kubeconfig }} (did converge/terraform apply succeed?)"
      when: not kc.stat.exists

    - name: List cluster nodes
      ansible.builtin.command:
        cmd: "kubectl --kubeconfig {{ kubeconfig }} get nodes"
      register: nodes
      changed_when: false

    - name: Assert the cluster has exactly one Ready node
      ansible.builtin.assert:
        that:
          - nodes.rc == 0
          - nodes.stdout_lines | length >= 2
          - "'Ready' in nodes.stdout_lines[1]"
        fail_msg: "kubectl get nodes did not show a single Ready node:\n{{ nodes.stdout }}"
        success_msg: "Cluster has exactly one Ready node"

    - name: List pods
      ansible.builtin.command:
        cmd: "kubectl --kubeconfig {{ kubeconfig }} get pods --all-namespaces"
      register: pods
      changed_when: false

    - name: Assert all system pods are Running
      ansible.builtin.assert:
        that:
          - pods.rc == 0
          - pods.stdout_lines | length > 2
        fail_msg: "kubectl get pods failed:\n{{ pods.stdout }}"
        success_msg: "System pods are running"
