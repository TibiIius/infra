---
# Tear down the QEMU installer VM and any scratch state the scenario created.
#
# Order: stop QEMU (PID file, then a distinctive fallback sweep), remove the
# scratch workdir (ISO, kernel, disk, logs), and clear the Terraform state the
# role wrote into the shared terraform dir so the repo is left clean.
- name: Tear down the QEMU Talos VM and scratch state
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    workdir: "{{ talos_workdir }}"
    tf_dir: "{{ talos_tf_dir }}"
  tasks:
    - name: Stop QEMU via the recorded PID
      ansible.builtin.shell: |
        set -euo pipefail
        if [ -f qemu.pid ]; then
          PID="$(cat qemu.pid)"
          kill "$PID" 2>/dev/null || true
          for _ in $(seq 1 40); do
            kill -0 "$PID" 2>/dev/null || break
            sleep 0.5
          done
          kill -9 "$PID" 2>/dev/null || true
          echo "stopped qemu pid=${PID}"
        else
          echo "no qemu.pid found; nothing to stop"
        fi
      args:
        chdir: "{{ workdir }}"
        executable: /bin/bash
      failed_when: false
      changed_when: false

    - name: Sweep any stray Talos QEMU VMs (fallback)
      ansible.builtin.shell: |
        set -euo pipefail
        # Distinctive: our kernel cmdline carries talos.platform=metal.
        pkill -f "talos.platform=metal" 2>/dev/null || true
        echo "stray qemu sweep done"
      args:
        executable: /bin/bash
      failed_when: false
      changed_when: false

    # NOTE: Commented out to keep workdir for debugging
    # - name: Remove the scratch workdir
    #   ansible.builtin.file:
    #     path: "{{ workdir }}"
    #     state: absent

    - name: Remove Terraform state from the shared terraform dir
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ tf_dir }}/terraform.tfstate"
        - "{{ tf_dir }}/terraform.tfstate.backup"
      failed_when: false
